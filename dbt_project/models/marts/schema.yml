version: 2

models:
  - name: dim_customers
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null

  - name: fct_orders
    columns:
      - name: order_id
        data_type: integer
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_type: integer
        data_tests:
          - not_null
      - name: order_date
        data_type: date
      - name: amount
        data_type: integer
      - name: status
        data_type: varchar

  - name: fct_events
    columns:
      - name: event_id
        data_type: integer
        data_tests:
          - unique
          - not_null
      - name: user_id
        data_type: integer
        data_tests:
          - not_null
      - name: event_type
        data_type: varchar
      - name: event_ts
        data_type: timestamp
      - name: order_id
        data_type: integer

  - name: order_customer_detail
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
