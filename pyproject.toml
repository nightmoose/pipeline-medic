[project]
name = "pipeline-medic"
version = "0.1.0"
description = "Diagnoses failing dbt jobs orchestrated by Airflow, writes a fix, verifies it in a sandbox, and proposes a PR."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.12"
dependencies = [
    "dbt-core>=1.8,<2",
    "dbt-duckdb>=1.8,<2",
    "duckdb>=1.8,<3",
    "apache-airflow==2.10.5",
    "sqlglot>=23,<26",
    "openai>=1.40,<2",
    "typer>=0.12,<1",
    "rich>=13,<14",
    "jinja2>=3.1,<4",
    "pydantic>=2,<3",
]

[project.scripts]
pipeline-medic = "pipeline_medic.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pip-licenses>=4,<6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline_medic"]
